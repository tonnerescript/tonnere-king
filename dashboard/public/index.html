<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<title>TicketBot Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="box">


<h1>🎫 TicketBot Dashboard</h1>


<div class="cards">


<div class="card">

<h2>🟢 Ouverts</h2>

<p id="open">0</p>

</div>



<div class="card">

<h2>🔴 Fermés</h2>

<p id="close">0</p>

</div>


</div>



<h2>📂 Tickets</h2>


<table>


<thead>

<tr>

<th>ID</th>

<th>Utilisateur</th>

<th>Catégorie</th>

<th>Status</th>

<th>Staff</th>

</tr>

</thead>



<tbody id="tickets">

</tbody>


</table>


</div>



<script src="app.js"></script>


</body>

</html>
